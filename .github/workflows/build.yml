name: Native core
on: [push, pull_request]
jobs:
  core:
    env:
      CYCODE_EDITOR_ROOT: ${{ github.workspace }}/runtime/deps/cycode-reader
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check sources without native executables
        run: python app/scripts/verify_sources.py
      - name: Verify update archive authoring without native processes
        run: python app/tests/test_release_package.py
      - name: Resolve shared editor pin
        id: editor
        run: python -c "import json,os; from pathlib import Path; revision=json.loads(Path('app/editor-source.lock.json').read_text())['revision']; Path(os.environ['GITHUB_OUTPUT']).open('a').write('revision='+revision+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: MrMybal/CyCodeReader
          ref: ${{ steps.editor.outputs.revision }}
          path: runtime/deps/cycode-reader
          token: ${{ secrets.CYCODE_READER_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep ninja-build
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep ninja
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - run: python app/scripts/fetch_dependencies.py --core-only
      - name: Explicit native validation on the CI runner
        run: python app/scripts/build.py --core-only --run-tests
      # Private Reader access needs a read-only CYCODE_READER_READ_TOKEN secret.
      # Full GUI/MCP jobs also require the owner's CyUI and Core wheel.
      # This workflow has not been run on GitHub during local development.
